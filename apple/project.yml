name: FelicitySolar
options:
  bundleIdPrefix: com.blessing
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    SUPPORTED_PLATFORMS: 'iphoneos iphonesimulator macosx'
    SUPPORTS_MACCATALYST: NO
    SDKROOT: auto
    TARGETED_DEVICE_FAMILY: '1,2'
    INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: 'Connect to your private Felicity Solar dashboard on your Mac.'
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_SolarKeychainGroup: $(AppIdentifierPrefix)com.blessing.FelicitySolar
    CODE_SIGN_ENTITLEMENTS: Shared/Felicity.entitlements
targets:
  FelicitySolar:
    type: application
    platform: auto
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.blessing.FelicitySolar.oauth
            CFBundleURLSchemes: [com.blessing.felicitysolar]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blessing.FelicitySolar
        INFOPLIST_KEY_CFBundleDisplayName: Felicity Solar
    dependencies:
      - target: SolarWidget
        embed: true
  SolarWidget:
    type: app-extension
    platform: auto
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Felicity Solar Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blessing.FelicitySolar.Widget
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: Shared/Widget.entitlements
schemes:
  FelicitySolar:
    build:
      targets:
        FelicitySolar: all
        SolarWidget: all
